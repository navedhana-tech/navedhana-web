    <!-- Dynamic Domain Detection Script -->
    <script>
      (function() {
        const hostname = window.location.hostname;
        const isFresh = hostname === 'fresh.navedhana.com' || hostname.includes('fresh.navedhana.com');
        const baseUrl = isFresh ? 'https://fresh.navedhana.com' : 'https://www.navedhana.com';
        const currentPath = window.location.pathname;
        const fullUrl = baseUrl + currentPath;
        // fresh.navedhana.com serves byte-identical content to www — canonical
        // always points at www so Google consolidates both into one indexed
        // URL instead of treating them as duplicate content on two domains.
        const CANONICAL_BASE = 'https://www.navedhana.com';
        const canonicalUrl = CANONICAL_BASE + currentPath;

        // Set canonical URL
        let canonical = document.querySelector('link[rel="canonical"]');
        if (!canonical) {
          canonical = document.createElement('link');
          canonical.rel = 'canonical';
          document.head.appendChild(canonical);
        }
        canonical.href = canonicalUrl;

        // fresh.navedhana.com is not promoted in search — noindex it outright
        // (on top of the canonical pointing at www above) so Google drops it
        // from the index instead of just consolidating it.
        if (isFresh) {
          ['robots', 'googlebot'].forEach((name) => {
            const tag = document.querySelector('meta[name="' + name + '"]');
            if (tag) tag.setAttribute('content', 'noindex, follow');
          });
        }

        // Update sitemap reference — always www, fresh has no sitemap of its own
        let sitemap = document.querySelector('link[rel="sitemap"]');
        if (!sitemap) {
          sitemap = document.createElement('link');
          sitemap.rel = 'sitemap';
          sitemap.type = 'application/xml';
          document.head.appendChild(sitemap);
        }
        sitemap.href = 'https://www.navedhana.com/sitemap.xml';

        // Update preconnect
        let preconnect = document.querySelector('link[rel="preconnect"]');
        if (preconnect) {
          preconnect.href = baseUrl;
        }

        // Store for use in structured data
        window.__NAVEDHANA_BASE_URL__ = baseUrl;
        window.__NAVEDHANA_FULL_URL__ = fullUrl;
        window.__NAVEDHANA_CANONICAL_URL__ = canonicalUrl;
      })();
    </script>

    <script>
        // Update structured data and meta tags with current domain
      (function() {
        const hostname = window.location.hostname;
        const isFresh = hostname === 'fresh.navedhana.com' || hostname.includes('fresh.navedhana.com');
        const domainDisplay = isFresh ? 'fresh.navedhana.com' : 'www.navedhana.com';
        const currentPath = window.location.pathname;
        // Same www-only consolidation as the canonical link above — og:url and
        // the JSON-LD @ids should point at the one indexed domain, not
        // whichever host the visitor happens to be on.
        const canonicalUrl = 'https://www.navedhana.com' + currentPath;

        // Update page title
        const title = document.getElementById('page-title');
        if (title) {
          title.textContent = 'Navedhana - Software Development & AI Engineering Company | ' + domainDisplay;
        }

        // Update Open Graph URL
        const ogUrl = document.getElementById('og-url');
        if (ogUrl) ogUrl.content = canonicalUrl;

        // Update Twitter URL
        const twitterUrl = document.getElementById('twitter-url');
        if (twitterUrl) twitterUrl.content = canonicalUrl;
        
        // Update structured data
        const structuredData = document.getElementById('structured-data');
        if (structuredData) {
          try {
            const data = JSON.parse(structuredData.textContent);
            if (data['@graph']) {
              // @id/url deliberately stay on www.navedhana.com regardless of
              // which host is serving the page — one canonical entity per
              // page, not a second copy under fresh.navedhana.com.
              data['@graph'].forEach(item => {
                if (item['@type'] === 'WebPage' && item.url) {
                  item.url = canonicalUrl;
                }
              });
              structuredData.textContent = JSON.stringify(data);
            }
          } catch(e) {
            console.error('Error updating structured data:', e);
          }
        }
      })();
